<style>:root{
  --green:#0b6b3a;--green-d:#084c29;--ochre:#e8a317;--cream:#fff7e6;--sand:#f3e6c8;--ink:#1d2a22;--muted:#5c6b61;--red:#b3361f;--card:#ffffff;--line:#e6d9ba;
  --wa-bg:#e9dfc7;--wa-me:#d8f3c3;--wa-them:#ffffff;--radius:16px;--shadow:0 2px 10px rgba(30,40,20,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button{font:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
p{margin:.3em 0 .6em}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.boot{display:grid;place-items:center;height:100dvh;text-align:center;color:var(--muted)}
.spinner{width:36px;height:36px;border:4px solid var(--sand);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.ankara{height:10px;background:repeating-linear-gradient(90deg,var(--ochre) 0 12px,var(--green) 12px 24px,#fff3d1 24px 30px,var(--green) 30px 42px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:0;background:var(--green);color:#fff;font-weight:650;box-shadow:var(--shadow);width:100%}
.btn:active{transform:translateY(1px)}
.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green);box-shadow:none}
.btn.ochre{background:var(--ochre);color:#2b1d00}
.btn.ghost{background:transparent;color:var(--green);box-shadow:none;width:auto;min-height:40px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}.row.wrapx{flex-wrap:wrap}.grow{flex:1}.sp{justify-content:space-between}
.stack>*+*{margin-top:12px}

/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;border:1px solid var(--line)}
.card.flat{box-shadow:none}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sand);font-size:.78rem;font-weight:600}
.chip.g{background:#d6f0de;color:var(--green-d)}.chip.r{background:#f8d9d2;color:var(--red)}.chip.o{background:#fde9b8;color:#6a4700}
.pill-nav{display:flex;gap:8px;overflow:auto;padding:4px 0}

/* top bar + nav */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d7a43,#0b6b3a);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px}
.top .big{font-weight:800;font-size:1.15rem}
.top .sub{opacity:.85;font-size:.75rem}
.top .sound{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:0;padding:8px 2px 6px;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
.nav button svg{display:block;margin:0 auto 2px}
.nav button.on{color:var(--green)}
.nav .badge{position:absolute;top:2px;left:55%;background:var(--red);color:#fff;border-radius:99px;font-size:.65rem;padding:0 6px}
.screen{padding-top:14px;padding-bottom:96px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile .k{font-size:.74rem;color:var(--muted);font-weight:600}
.tile .v{font-size:1.2rem;font-weight:800}
.tile .n{font-size:.72rem;color:var(--muted)}
.neg{color:var(--red)}.pos{color:var(--green)}
.bar{height:10px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.o>i{background:var(--ochre)}

/* character cards */
.chars{display:grid;gap:12px}
.char{display:flex;gap:12px;padding:12px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.char.sel{border-color:var(--green)}
.char.locked{opacity:.8}
.char .av{flex:0 0 76px}
.hero{background:linear-gradient(180deg,#0b6b3a,#0a5a31);color:#fff;border-radius:0 0 28px 28px;padding:22px 16px 18px;margin:0 -16px 12px}
.hero h1{margin-bottom:6px}
.hero p{opacity:.92}

/* sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,30,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b));animation:up .22s ease-out}
.sheet.center{border-radius:22px;margin:auto;max-height:86dvh}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{float:right;background:none;border:0;font-size:1.5rem;line-height:1;color:var(--muted)}
label{display:block;font-weight:650;font-size:.9rem;margin:10px 0 4px}
input[type=number],input[type=text],input[type=password],input[type=email],select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit}
input:focus,select:focus{outline:3px solid #b9e3c7;border-color:var(--green)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;margin:6px 0;width:100%;text-align:left}
.opt.on{border-color:var(--green);background:#eaf7ee}
.opt b{display:block}

/* chat */
.chat{background:var(--wa-bg);background-image:radial-gradient(rgba(11,107,58,.05) 1px,transparent 1px);background-size:14px 14px;border-radius:18px;padding:10px;min-height:42dvh;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:8px 11px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease-out}
.msg.c{background:var(--wa-them);border-top-left-radius:3px;align-self:flex-start}
.msg.me{background:var(--wa-me);border-top-right-radius:3px;align-self:flex-end}
.msg .t{display:block;text-align:right;font-size:.65rem;color:#6b7c70;margin-top:2px}
.msg.sys{align-self:center;background:#fff3d1;font-size:.78rem;color:#6a4700}
.typing{align-self:flex-start;background:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#98a89c;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.replies{display:grid;gap:8px;margin-top:10px}
.reply{background:#fff;border:2px solid var(--green);color:var(--ink);text-align:left;border-radius:14px;padding:10px 12px;font-size:.93rem;box-shadow:var(--shadow)}
.reply:active{background:#eaf7ee}
.leadrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.leadrow .dot{width:38px;height:38px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:800;color:var(--green)}
.leadrow .pv{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}

/* money */
.wf{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.92rem}
.wf .tot{font-weight:800;border-top:2px solid var(--ink);padding-top:4px;margin-top:4px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:#222;color:#fff;padding:10px 16px;border-radius:14px;z-index:70;max-width:90vw;box-shadow:var(--shadow);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast.good{background:var(--green)}.toast.bad{background:var(--red)}
.hint{background:#fff3d1;border-left:5px solid var(--ochre);border-radius:10px;padding:8px 12px;font-size:.88rem}
.lesson{background:#e9f6ee;border-left:5px solid var(--green);border-radius:10px;padding:10px 12px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.score{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.85rem;margin:4px 0}
svg text{font-family:inherit}
@media(min-width:640px){.chars{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(3,1fr)}}


.top .clk{flex:1;min-width:0}.top .clk .big{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cash{text-align:right}.top .cash .big{font-size:1.05rem}
.homebtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:34px;height:34px;font-size:1.4rem;line-height:1}
.brand{letter-spacing:.14em;font-size:.72rem;opacity:.8;font-weight:700}
.hero{background:radial-gradient(120% 120% at 0% 0%,#14924f 0,#0b6b3a 45%,#073d22 100%)}
.hero h1{font-size:2rem;letter-spacing:-.01em}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;color:var(--muted);min-height:44px}
.seg button.on{background:#fff;color:var(--green);box-shadow:var(--shadow)}
.note{background:#eef7f0;border-radius:12px;padding:10px 12px;font-size:.85rem;color:#234;border:1px solid #cfe6d6}
.hint.bad{background:#fde3dd;border-left-color:var(--red)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}.dots i{width:28px;height:5px;border-radius:9px;background:var(--sand)}.dots i.on{background:var(--green)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:2px solid var(--line);background:#fff;border-radius:18px;min-height:112px;transition:transform .15s,border-color .15s,box-shadow .15s}
.pickcard:hover{transform:translateY(-2px)}.pickcard.on{border-color:var(--green);background:#eaf7ee;box-shadow:0 0 0 3px #b9e3c7}
.pickcard .ic{font-size:2rem;line-height:1}
.feature{background:linear-gradient(135deg,#0b6b3a,#084c29);color:#fff;border-radius:20px;padding:16px;margin:8px 0;box-shadow:var(--shadow)}
.feature h3{font-size:1.2rem;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tilebtn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tilebtn .ic{font-size:1.6rem}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:1.1rem}
.char{transition:transform .15s,box-shadow .2s}.char:hover{transform:translateY(-2px)}
.code{font:800 1.3rem ui-monospace,monospace;letter-spacing:.14em;background:var(--sand);padding:8px 12px;border-radius:12px;cursor:pointer}
tr.me td{background:#fff3d1;font-weight:700}
.rv{display:grid;grid-template-columns:18px 1fr 80px 82px;gap:8px;align-items:center;font-size:.85rem;padding:3px 0}.rv.me{background:#fff3d1;border-radius:8px}.rv .bar.r>i{background:var(--red)}
.goalcard{margin-top:10px}.goalres.hit{border:2px solid var(--ochre);background:#fffbe9}
.prodcard svg{flex:none}
/* floating buttons */
.fab{position:fixed;right:12px;z-index:31;border:0;border-radius:99px;min-height:46px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab span{font-size:.8rem}.fab.map{bottom:calc(74px + var(--safe-b));background:var(--ochre);color:#2b1d00}.fab.guide{bottom:calc(128px + var(--safe-b));background:#fff;color:var(--green);border:2px solid var(--green)}
.fab svg{width:20px;height:20px}
.gpanel{position:fixed;z-index:60;right:10px;left:10px;bottom:calc(74px + var(--safe-b));max-width:420px;margin-left:auto;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:12px;max-height:70dvh;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.glog{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px;max-height:36dvh}
.gm{padding:8px 11px;border-radius:12px;font-size:.9rem;max-width:92%}.gm.bot{background:#eaf7ee;align-self:flex-start}.gm.me{background:var(--wa-me);align-self:flex-end}
.x2{background:none;border:0;font-size:1.5rem;color:var(--muted)}
.gpanel input{min-height:44px;width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit}
.sugg{max-height:78px;overflow:auto}
/* welcome */
.overlay.center{align-items:center;padding:14px;z-index:80;backdrop-filter:blur(3px)}
.sheet.welcome{padding:0;overflow:auto;border-radius:24px;max-width:460px}
.wtop{background:linear-gradient(135deg,#0d7a43,#073d22);color:#fff;padding:18px 18px 16px}.wtop h2{margin:4px 0}.wbody{padding:14px 16px 18px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.wchip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column}.wchip b{font-size:1.02rem}
.wnext{background:#fff3d1;border-left:5px solid var(--ochre);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.weektrack{display:flex;gap:6px;margin:10px 0}.weektrack span{flex:1;text-align:center;font-size:.72rem;padding:5px 2px;border-radius:8px;background:var(--sand);color:var(--muted);font-weight:700}.weektrack span.on{background:var(--green);color:#fff}
/* map */
.townmap .bld{cursor:pointer;transition:transform .15s}.townmap .bld:hover,.townmap .bld:focus{transform:translateY(-3px);outline:none}
.townmap .bld.glow rect:first-child{animation:glow 1.4s ease-in-out infinite}
.townmap .pin{animation:pinpulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{50%{filter:brightness(1.35)}}@keyframes pinpulse{50%{transform:scale(1.5);opacity:.6}}
/* motion */
.rise{animation:rise .35s ease-out both}.pop{animation:popin .25s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.scene{border-radius:16px;display:block}
.cloud.c1{animation:drift 26s linear infinite}.cloud.c2{animation:drift 38s linear infinite reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.sun{animation:sunpulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sunpulse{50%{transform:scale(1.12)}}
.twinkle circle{animation:blink 2.4s infinite}.lights rect{animation:blink 5s infinite}
.bus{animation:bus 14s linear infinite}@keyframes bus{from{transform:translateX(-90px)}to{transform:translateX(380px)}}
.car{animation:bus 18s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
.road{animation:road 1s linear infinite}@keyframes road{to{stroke-dashoffset:-24}}
.flag{animation:wave 2s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}@keyframes wave{50%{transform:skewY(6deg)}}
.cursor{animation:blink 1s infinite}.screenglow{animation:blink 3s infinite}.charge{animation:charge 2s ease-in-out infinite}@keyframes charge{50%{width:16px}}
.blink{animation:eyes 4s infinite;transform-box:fill-box;transform-origin:center}@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.avsvg{border-radius:50%;box-shadow:var(--shadow)}.av-init{display:grid;place-items:center;border-radius:50%;background:var(--sand);font-weight:800;color:var(--green)}
.coin{position:absolute;left:50%;top:50%;font-style:normal;font-weight:800;color:#b07a00;pointer-events:none;animation:coin 1.2s ease-out forwards;animation-delay:var(--d)}
@keyframes coin{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.chat{position:relative}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r))}}
.btn{transition:transform .1s,box-shadow .15s}.btn:hover:not([disabled]){box-shadow:0 4px 14px rgba(0,0,0,.2)}
.card{transition:box-shadow .2s}
.nav button.on{box-shadow:inset 0 3px 0 var(--green)}
.screen{padding-bottom:170px}
:focus-visible{outline:3px solid #7cc79a;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wabox{background:#e8f8ee;border:1px solid #b7e3c6;border-radius:14px;padding:12px;margin:12px 0}
.btn.wa{background:#25d366;color:#06361a;text-decoration:none;font-weight:800}
.savedtag{font-size:.78rem;color:var(--green);text-align:center;margin:8px 0}
.savepill{position:fixed;left:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:25;font-size:.7rem;background:#ffffffd9;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--green)}

/* Advert preview: shows what customers will see */
.adp{border-radius:16px;overflow:hidden;border:1px solid #d9d2c0;background:#fff;max-width:340px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.adp-top{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:.78rem;font-weight:700}
.adp-top i{margin-left:auto;font-style:normal;font-weight:500;opacity:.7}
.adp-dot{width:22px;height:22px;border-radius:50%;background:var(--green,#0b6b3a)}
.adp-pic{position:relative;display:grid;place-items:center;height:130px;background:#f4efe2}
.adp-pic.model{background:linear-gradient(135deg,#ffe9b3,#f7c9a8)}
.adp-pic.video{background:linear-gradient(135deg,#1f2937,#0b6b3a)}
.adp-play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:3px 8px;border-radius:999px}
.adp-body{padding:10px 12px;font-size:.88rem;line-height:1.35}
.adp-body ul{margin:6px 0;padding-left:18px}
.adp.wa{background:#0f2a22;color:#fff;border-color:#0f2a22}.adp.wa .adp-pic{background:#16382d}.adp.wa .adp-pic.model{background:#2b4a3c}
.adp.ig .adp-dot{background:linear-gradient(45deg,#f9a825,#d62976,#4f5bd5)}
.adp.inf .adp-dot{background:#e8a317}

.langchip{position:fixed;left:12px;bottom:12px;z-index:40;border:1px solid #d9d2c0;background:#fff;color:var(--ink,#1c2b22);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.plan{counter-reset:p;list-style:none;padding:0;margin:8px 0}
.plan li{counter-increment:p;position:relative;padding:8px 8px 8px 38px;margin:6px 0;background:#fffaf0;border-radius:12px;font-size:.92rem}
.plan li:before{content:counter(p);position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--green,#0b6b3a);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.8rem}
.sharepv{max-width:100%;border-radius:14px;border:1px solid #d9d2c0;margin:8px 0}
body[data-route=game] .langchip{bottom:84px;left:12px}
</style>
</head>
